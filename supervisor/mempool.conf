[supervisord]
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/watchtower/supervisord.pid
childlogdir=/run/watchtower


[unix_http_server]
file=/run/watchtower/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/watchtower/supervisor.sock


[program:slpstream_fountainhead]
directory = /code
command = python manage.py slpstream_fountainhead
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopasgroup = true


[program:bitsocket]
directory = /code
command = python manage.py bitsocket
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopasgroup = true


[program:bchd_grpc_stream]
directory = /code
command = python manage.py bchd_grpc_stream
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopasgroup = true

[program:bchn_zmq_listener]
directory = /code
command=python manage.py bchn_zmq_listener
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopasgroup=true
