version: "3.7"
services:
  docker-host:
    image: qoomon/docker-host
    cap_add: [ 'NET_ADMIN', 'NET_RAW' ]
    mem_limit: 8M
    restart: on-failure
  web:
    container_name: watchtower_web
    build: /root/watchtower
    image: watchtower_web
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: [ "supervisord", "-c", "/code/supervisord-mainnet.conf", "--nodaemon" ]
    env_file: /root/watchtower/compose/.env_mainnet
    environment:
      GOOGLE_APP_CREDENTIALS_PATH: /run/watchtower-credentials/firebase-admin-credentials.json
      P2P_REGISTRATION_PROXY_HOPS: "${P2P_REGISTRATION_PROXY_HOPS:-1}"
    volumes:
      # Provision this directory on the host and grant UID/GID 10001 read access.
      - /var/opt/watchtower/credentials:/run/watchtower-credentials:ro
      # These host directories must be writable by UID/GID 10001.
      - /var/www/images:/images
      - /var/opt/watchtower/private-p2p-proofs:/code/private-p2p-proofs
      - /var/opt/watchtower/media:/code/media
      - /code/anyhedge/js/node_modules
      - /code/stablehedge/js/node_modules
    ports:
      # Both WSGI and ASGI accept HTTP; only host Nginx may reach published ports.
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:9000:9000"
