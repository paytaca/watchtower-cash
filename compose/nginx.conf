# This file should be written into /etc/nginx/sites-enabled/watchtower

server {

    listen 80;
    server_name watchtower.cash;

    location / {
        proxy_pass http://127.0.0.1:8000;
        # Registration throttling counts this trusted hop from the right of XFF.
        # Keep both backend ports (WSGI and ASGI) bound to host loopback.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $server_name;
    } 

    # Legacy payment-proof URLs are never public, including on older workers.
    location = /media/image_uploads { return 404; }
    location ^~ /media/image_uploads/ { return 404; }

    # Route media through Django so resolved-path checks also cover aliases.
    location /media {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

}


server {
    listen 80;
    server_name images.watchtower.cash;

    location / {
	    root /var/www/images;
	    autoindex on;
	    autoindex_exact_size off;
    }
}


